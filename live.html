<style>

:root{
  color-scheme: dark;
  /* DARK (opt-in): Teal Blue family. */
  --page:#02222c; --page-2:#032b38;
  --surface:rgba(255,255,255,.05); --surface-2:rgba(255,255,255,.075); --surface-3:rgba(255,255,255,.11);
  --hairline-top:rgba(255,255,255,.06);
  --ink-1:#f2fbfd; --ink-2:#bcd6de; --muted:#86a6b1;
  --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.22);
  --accent:#2c97e9; --accent-strong:#6cbdf4; --accent-soft:rgba(44,151,233,.18);
  --accent-2:#1df13a;
  --ce:#5db2f0; --ce-soft:rgba(93,178,240,.16); --pe:#ffa63a; --pe-soft:rgba(255,166,58,.15);
  --good:#1df13a; --good-text:#1df13a; --good-soft:rgba(29,241,58,.14);
  --loss:#ff6b63; --loss-text:#ff6b63; --loss-soft:rgba(255,107,99,.16);
  --warn:#ffd24a; --warn-soft:rgba(255,210,74,.14);
  --neutral-chip:rgba(255,255,255,.08); --neutral-text:#bcd6de;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 16px 40px -20px rgba(0,0,0,.6);
  --term-bg:#043c4e; --term-bg-2:#0a4a5f; --term-border:rgba(255,255,255,.12);
  --term-text:#a9c8d3; --term-text-strong:#ffffff; --term-accent:#2c97e9;
  --term-good:#1df13a; --term-loss:#ff6b63;
  --brandbar-bg:#043c4e; --brandbar-ink:#ffffff;
  --page-grad:radial-gradient(60% 50% at 88% -8%, rgba(44,151,233,.20), transparent 70%),
              radial-gradient(48% 40% at 0% 0%, rgba(29,241,58,.06), transparent 62%);
  --grad-text:linear-gradient(90deg,#2c97e9 0%,#1df13a 100%);
  --btn-grad:linear-gradient(90deg,#0071bb,#2c97e9);
}
:root[data-theme="light"]{
  color-scheme: light;
  /* LIGHT (default): white + soft aqua, Teal Blue ink. */
  --page:#f3fafd; --page-2:#e8f5fa;
  --surface:#ffffff; --surface-2:#eef7fa; --surface-3:#dcedf3;
  --hairline-top:transparent;
  --ink-1:#043c4e; --ink-2:#44606b; --muted:#5f7882;
  --border:rgba(4,60,78,.12); --border-strong:rgba(4,60,78,.24);
  --accent:#2c97e9; --accent-strong:#0071bb; --accent-soft:#dff0fc;
  --accent-2:#043c4e;
  --ce:#2c97e9; --ce-soft:#e0f0fc; --pe:#c56a1f; --pe-soft:#fbe9e0;
  --good:#0c9a26; --good-text:#07781c; --good-soft:#dcfbe2;
  --loss:#d03b3b; --loss-text:#c02f2f; --loss-soft:#fbe4e2;
  --warn:#a3720a; --warn-soft:#fbf1d6;
  --neutral-chip:#e8f2f6; --neutral-text:#44606b;
  --shadow:0 1px 2px rgba(4,60,78,.06), 0 12px 30px -16px rgba(4,60,78,.22);
  --term-bg:#043c4e; --term-bg-2:#0a4a5f; --term-border:rgba(255,255,255,.12);
  --term-text:#a9c8d3; --term-text-strong:#ffffff; --term-accent:#2c97e9;
  --term-good:#1df13a; --term-loss:#ff6b63;
  --brandbar-bg:#ffffff; --brandbar-ink:#043c4e;
  --page-grad:radial-gradient(70% 55% at 90% -12%, #d2eff8 0%, rgba(210,239,248,0) 70%),
              radial-gradient(55% 45% at 0% 0%, #e6f8fb 0%, rgba(230,248,251,0) 65%);
  --grad-text:linear-gradient(90deg,#0071bb 0%,#2c97e9 55%,#19c534 100%);
  --btn-grad:linear-gradient(90deg,#0071bb,#2c97e9);
}

*{box-sizing:border-box;} html,body{height:100%;}
body{ background:var(--page); color:var(--ink-1); font-family:"Montserrat","Avenir Next",Avenir,sans-serif; font-size:14px; line-height:1.5; margin:0; }
.mono{ font-family:"Montserrat","Avenir Next",Avenir,sans-serif; font-variant-numeric:tabular-nums; }
.wrap{ max-width:1000px; margin:0 auto; padding:26px 24px 60px; }
.back-link{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--ink-2); text-decoration:none; margin-bottom:16px; }
.back-link:hover{ color:var(--accent-strong); }
.head{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
.head h1{ font-size:22px; font-weight:700; margin:0; }
.pill{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:20px; text-transform:uppercase; letter-spacing:.04em; }
.pill.live{ background:var(--good); color:#04220c; } .pill.live .dot{ animation: pulse 1.4s ease-in-out infinite; }
.pill.stale{ background:var(--warn-soft); color:var(--warn); } .pill.idle{ background:var(--surface-2); color:var(--muted); }
.pill .dot{ width:7px; height:7px; border-radius:50%; background:currentColor; display:inline-block; }
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
.combined-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; margin-bottom:6px; }
.combined-tiles{ margin-bottom:12px; }
.tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.tab-btn{ font-family:"Montserrat","Avenir Next",Avenir,sans-serif; font-size:12.5px; font-weight:600; padding:8px 14px;
  border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--ink-2); cursor:pointer; }
.tab-btn.active{ background:var(--accent); color:#fff; border-color:transparent; }
.tab-btn .tab-done{ margin-left:5px; font-size:10px; opacity:.85; }
.panel{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 20px; margin-bottom:16px; box-shadow:var(--shadow); }
.idle-panel{ text-align:center; padding:48px 24px; color:var(--ink-2); }
.idle-panel .big{ font-size:16px; font-weight:600; color:var(--ink-1); margin-bottom:8px; }
.idle-panel code{ display:inline-block; margin-top:10px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:8px 14px; font-family:"Montserrat","Avenir Next",Avenir,sans-serif; font-size:12.5px; color:var(--accent-strong); }
.stale-banner{ display:flex; gap:10px; background:var(--warn-soft); color:var(--warn); border-radius:10px; padding:12px 16px; margin-bottom:16px; font-size:13px; }
.tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:16px; overflow:hidden; margin-bottom:16px; box-shadow:var(--shadow); }
.tile{ background:var(--page); padding:16px 18px; }
.tile .lbl{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; }
.tile .val{ font-family:"Montserrat","Avenir Next",Avenir,sans-serif; font-size:20px; font-weight:600; margin-top:6px; }
.tile .val.good{ color:var(--good); } .tile .val.bad{ color:var(--loss); }
.panel h2{ font-size:13.5px; font-weight:700; margin:0 0 12px; }
table{ width:100%; border-collapse:collapse; font-size:12.5px; }
th{ text-align:right; font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:600; padding:6px 10px; border-bottom:1px solid var(--border); }
th:first-child, th:nth-child(2){ text-align:left; }
td{ padding:7px 10px; text-align:right; font-family:"Montserrat","Avenir Next",Avenir,sans-serif; border-bottom:1px solid var(--border); white-space:nowrap; }
td:first-child, td:nth-child(2){ text-align:left; font-family:"Montserrat","Avenir Next",Avenir,sans-serif; }
.chip{ display:inline-flex; font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:5px; }
.chip.ce{ background:var(--ce-soft); color:var(--ce); } .chip.pe{ background:var(--pe-soft); color:var(--pe); }
.pos{ color:var(--good); } .neg{ color:var(--loss); }
.empty-row td{ text-align:center; color:var(--muted); padding:16px; }
.foot{ font-size:11px; color:var(--muted); margin-top:6px; }
.pill.live{ background:#1df13a !important; color:#04220c !important; }
.tile{ background:var(--term-bg); } .tile .lbl{ color:#a9c8d3; } .tile .val{ color:#fff; }
.tile .val.good{ color:#1df13a; } .tile .val.bad{ color:#ff8a83; }
.tiles{ background:rgba(255,255,255,.14); border-color:var(--term-bg); }

html{ -webkit-text-size-adjust:100%; }
body{ background:var(--page-grad), var(--page); background-attachment:fixed; font-variant-numeric:tabular-nums; }
.aurora{ display:none; }

/* Logo bar: flat colour only (the guidelines forbid gradients behind the logo). */
.brandbar{ position:relative; z-index:2; background:var(--brandbar-bg); border-bottom:1px solid var(--border); }
.brandbar-in{ max-width:1360px; margin:0 auto; padding:10px 30px; display:flex; align-items:center; gap:16px; }
.brandbar a.bb-logo{ display:inline-flex; line-height:0; }
.brandbar img{ height:38px; width:auto; display:block; }
.brandbar .logo-dark{ display:none; }
:root:not([data-theme="light"]) .brandbar .logo-light{ display:none; }
:root:not([data-theme="light"]) .brandbar .logo-dark{ display:block; }
.brandbar .bb-sep{ width:1px; height:24px; background:var(--border-strong); }
.brandbar .bb-tag{ font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--brandbar-ink); opacity:.8; }
:root[data-theme="light"] .brandbar .bb-tag{ color:var(--accent-strong); opacity:1; }
@media (max-width:560px){ .brandbar-in{ padding:8px 16px; } .brandbar img{ height:30px; } .brandbar .bb-tag{ display:none; } .brandbar .bb-sep{ display:none; } }

/* Brand headings: Picton Blue -> Malachite gradient text. */
.grad-text, .page-head h1, .topbar h1, .head h1{
  background:var(--grad-text); -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent; }

/* Brand button / active-pill treatment. */
.btn, .switch button.active, .dte-chk.active, .tab-btn.active, .fbtn.primary{ background:var(--btn-grad) !important; color:#fff !important; }

.brand-pledge{ margin-top:6px; font-size:11px; color:var(--muted); font-style:italic; }

<div class="wrap">
  <a class="back-link" href="index.html">&larr; Dashboard</a>
  <div class="head">
    <h1 id="title">Live Forward Test</h1>
    <span class="pill idle" id="statusPill"><span class="dot"></span><span id="statusText">Idle</span></span>
  </div>
  <div id="content"></div>
</div>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  function inr(n){ if (n==null||isNaN(n)) return '—';
    var neg = n<0; n = Math.abs(n); var d = n.toFixed(0);
    // Indian grouping: last three digits, then pairs (28,62,316) - same as report_template's formatIN.
    var s = d.length > 3 ? d.slice(0,-3).replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + d.slice(-3) : d;
    return (neg?'−':'') + '₹' + s; }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

  function idleHtml(){
    return '<div class="panel idle-panel"><div class="big">No forward test currently running.</div>'+
      '<div>Start one (or several together) from a terminal in the project folder:</div>'+
      '<code>venv\\Scripts\\python.exe forward_test.py &lt;strategy_name&gt; [strategy_name ...]</code></div>';
  }
  function staleHtml(lastUpdated){
    return '<div class="stale-banner">&#9888; Stale since '+esc(lastUpdated)+
      ' — the session may have stopped unexpectedly (e.g. a force-closed terminal). '+
      'The numbers below are its last known state, not live.</div>';
  }
  // Never present a fallback model figure as if the broker had said it.
  function marginTag(src){
    return src === 'broker' ? 'broker calc' : (src === 'mixed' ? 'broker + est.' : 'est.');
  }
  function tilesHtml(d){
    var tiles = [
      { lbl:'Total P&amp;L', v: inr(d.total_pnl), cls: d.total_pnl>=0?'good':'bad' },
      { lbl:'Realized', v: inr(d.realized_pnl), cls: d.realized_pnl>=0?'good':'bad' },
      { lbl:'Open MTM', v: inr(d.open_mtm), cls: d.open_mtm>=0?'good':'bad' },
      { lbl:'Trades so far', v: d.trades_count },
    ];
    if (d.lots != null) tiles.push({ lbl:'Size', v: d.lots+' lot'+(d.lots==1?'':'s') });
    if (d.margin_blocked != null) {
      var tag = marginTag(d.margin_source);
      tiles.push({ lbl:'Margin blocked ('+tag+')', v: inr(d.margin_blocked) });
      tiles.push({ lbl:'Peak margin ('+tag+')', v: inr(d.peak_margin||0) });
    }
    return '<div class="tiles">'+tiles.map(function(t){
      return '<div class="tile"><div class="lbl">'+t.lbl+'</div><div class="val '+(t.cls||'')+'">'+t.v+'</div></div>';
    }).join('')+'</div>';
  }
  function positionsHtml(d){
    var rows = (d.open_positions||[]).map(function(p){
      var unreal = p.last_price==null ? null :
        (p.qty<0 ? (p.entry_price-p.last_price) : (p.last_price-p.entry_price)) * Math.abs(p.qty);
      return '<tr><td><span class="chip '+p.option_type.toLowerCase()+'">'+p.option_type+'</span></td>'+
        '<td>'+p.strike+'</td><td>'+p.qty+'</td><td>'+p.entry_price.toFixed(2)+'</td>'+
        '<td>'+(p.last_price==null?'—':p.last_price.toFixed(2))+'</td>'+
        '<td class="'+(unreal>=0?'pos':'neg')+'">'+(unreal==null?'—':inr(unreal))+'</td></tr>';
    }).join('') || '<tr class="empty-row"><td colspan="6">No open legs right now.</td></tr>';
    return '<div class="panel"><h2>Open positions</h2><table><thead><tr>'+
      '<th>Leg</th><th>Strike</th><th>Qty</th><th>Entry ₹</th><th>Last ₹</th><th>Unrealized</th>'+
      '</tr></thead><tbody>'+rows+'</tbody></table></div>';
  }
  function tradesHtml(d){
    var rows = (d.trades||[]).slice().reverse().map(function(t){
      return '<tr><td><span class="chip '+t.option_type.toLowerCase()+'">'+t.option_type+'</span></td>'+
        '<td>'+t.strike+'</td><td>'+esc(t.exit_reason)+'</td>'+
        '<td class="'+(t.net_pnl>=0?'pos':'neg')+'">'+inr(t.net_pnl)+'</td></tr>';
    }).join('') || '<tr class="empty-row"><td colspan="4">No trades closed yet.</td></tr>';
    return '<div class="panel"><h2>Trades so far ('+(d.trades||[]).length+')</h2><table><thead><tr>'+
      '<th>Leg</th><th>Strike</th><th>Exit</th><th>Net</th></tr></thead><tbody>'+rows+'</tbody></table>'+
      '<div class="foot">Newest first. Full ledger is built once the session ends.</div></div>';
  }

  function setPill(cls, text){
    var el = $('statusPill'); el.className = 'pill '+cls;
    $('statusText').textContent = text;
  }

  // One tab per running strategy (see forward_test.py's "Running several
  // together") - remembers which tab is open across the 10s auto-refresh,
  // same session list shape each strategy has always written, just nested
  // under "sessions" now instead of being the whole payload.
  var activeTab = null;

  function combinedTilesHtml(sessions, margin, slippage){
    // Summed across every running strategy, shown above the tabs so it stays
    // visible no matter which strategy's own tab is currently open - the
    // per-tab tiles below only ever show that one session's own numbers.
    if (sessions.length < 2 && !margin) return '';
    var totalPnl = 0, realized = 0, openMtm = 0, trades = 0;
    sessions.forEach(function(s){
      totalPnl += s.total_pnl; realized += s.realized_pnl;
      openMtm += s.open_mtm; trades += s.trades_count;
    });
    var tiles = [
      { lbl:'Combined Total P&amp;L', v: inr(totalPnl), cls: totalPnl>=0?'good':'bad' },
      { lbl:'Combined Realized', v: inr(realized), cls: realized>=0?'good':'bad' },
      { lbl:'Combined Open MTM', v: inr(openMtm), cls: openMtm>=0?'good':'bad' },
      { lbl:'Trades so far (all)', v: trades },
    ];
    if (margin) {
      // One account, so the exchange would net one strategy's short calls against
      // another's short puts - "netted" is the figure that would really be blocked.
      var mtag = marginTag(margin.source);
      tiles.push({ lbl:'Margin blocked, netted ('+mtag+')', v: inr(margin.combined) });
      tiles.push({ lbl:'Peak margin, netted ('+mtag+')', v: inr(margin.peak_combined) });
      if (margin.peak_combined > 0)
        tiles.push({ lbl:'P&amp;L / peak margin', v: (totalPnl/margin.peak_combined*100).toFixed(2)+'%',
                     cls: totalPnl>=0?'good':'bad' });
    }
    if (slippage) tiles.push({ lbl:'Slippage per fill', v: slippage+'%' });
    return '<div class="combined-label">Combined across '+sessions.length+
      (sessions.length==1 ? ' strategy' : ' strategies')+'</div>'+
      '<div class="tiles combined-tiles">'+tiles.map(function(t){
        return '<div class="tile"><div class="lbl">'+t.lbl+'</div><div class="val '+(t.cls||'')+'">'+t.v+'</div></div>';
      }).join('')+'</div>';
  }

  function tabsHtml(sessions){
    if (sessions.length < 2) return '';
    return '<div class="tabs">'+sessions.map(function(s){
      var on = s.strategy === activeTab;
      var done = s.finished ? ' <span class="tab-done">&#10003; done</span>' : '';
      return '<button type="button" class="tab-btn'+(on?' active':'')+'" data-strategy="'+
        esc(s.strategy)+'">'+esc(s.display_name||s.strategy)+done+'</button>';
    }).join('')+'</div>';
  }

  function render(){
    fetch('live_status.json', {cache:'no-store'}).then(function(r){
      if (!r.ok) throw new Error('not found');
      return r.json();
    }).then(function(d){
      var sessions = d.sessions || [];
      if (!sessions.length) throw new Error('no sessions');
      if (!activeTab || !sessions.some(function(s){ return s.strategy === activeTab; })) {
        activeTab = sessions[0].strategy;
      }
      var active = sessions.filter(function(s){ return s.strategy === activeTab; })[0];

      $('title').textContent = sessions.length > 1
        ? sessions.length+' strategies running'
        : (active.display_name||active.strategy)+' — '+active.date;

      var ageMs = Date.now() - new Date(d.last_updated).getTime();
      var staleAfter = (d.poll_interval_seconds||60) * 3 * 1000;
      var html = combinedTilesHtml(sessions, d.margin, d.slippage_pct) + tabsHtml(sessions);
      if (ageMs > staleAfter) {
        setPill('stale', 'Stale');
        html += staleHtml(d.last_updated);
      } else {
        setPill('live', 'Live · updated '+d.last_updated.slice(11));
      }
      html += tilesHtml(active) + positionsHtml(active) + tradesHtml(active);
      $('content').innerHTML = html;
      document.querySelectorAll('.tab-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          activeTab = btn.getAttribute('data-strategy');
          render();
        });
      });
    }).catch(function(){
      $('title').textContent = 'Live Forward Test';
      setPill('idle', 'Idle');
      $('content').innerHTML = idleHtml();
    });
  }
  render();
  setInterval(render, 10000);
})();
</script>
